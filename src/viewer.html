<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cf-geotiff-tileserver</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root { --bg:#12141a; --panel:#1b1e26; --line:#2c313d; --fg:#e6e8ee; --dim:#9aa3b5; --accent:#5aa9e6; --faint2:#6b7385; }
  * { box-sizing:border-box }
  body { margin:0; font:13px/1.5 ui-sans-serif,system-ui,sans-serif; background:var(--bg); color:var(--fg);
         display:grid; grid-template-columns:340px 1fr; height:100vh }
  @media (max-width:800px){ body{ grid-template-columns:1fr; grid-template-rows:auto 1fr } }
  aside { background:var(--panel); border-right:1px solid var(--line); padding:16px; overflow:auto }
  h1 { font-size:14px; margin:0 0 2px; letter-spacing:.02em }
  h1 + p { margin:0 0 18px; color:var(--dim); font-size:12px }
  label { display:block; margin:12px 0 4px; color:var(--dim); font-size:11px;
          text-transform:uppercase; letter-spacing:.06em }
  input, select, button { width:100%; padding:7px 9px; font:inherit; color:var(--fg);
          background:#12141a; border:1px solid var(--line); border-radius:5px }
  button { background:var(--accent); color:#0b0d12; border-color:var(--accent); font-weight:600;
           cursor:pointer; margin-top:14px }
  button:hover { filter:brightness(1.1) }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px }
  #map { height:100% }
  #status { margin-top:14px; padding:9px; border-radius:5px; font-size:12px; white-space:pre-wrap;
            word-break:break-word; display:none }
  #status.err { display:block; background:#3a1d22; border:1px solid #6b2b33; color:#ffb4bd }
  #status.ok  { display:block; background:#16202a; border:1px solid var(--line); color:var(--dim) }
  .hint { text-transform:none; letter-spacing:0; color:var(--faint2) }
  #ramp { height:8px; border-radius:3px; margin-top:6px; display:none }
  #ramp.on { display:block }
  dl { margin:14px 0 0; font-size:12px; display:grid; grid-template-columns:auto 1fr; gap:3px 10px }
  dt { color:var(--dim) } dd { margin:0; text-align:right; font-variant-numeric:tabular-nums }
</style>

<aside>
  <h1>cf-geotiff-tileserver</h1>
  <p>titiler in Rust, on a Cloudflare Worker.</p>

  <label for="example">Example</label>
  <select id="example"></select>

  <label for="url">COG URL</label>
  <input id="url" placeholder="https://…/cog.tif">

  <div class="row">
    <div><label for="bidx">bidx</label><input id="bidx" placeholder="1,2,3"></div>
    <div><label for="rescale">rescale</label><input id="rescale" placeholder="auto"></div>
  </div>

  <label for="colormap">Colormap <span class="hint">single band only</span></label>
  <select id="colormap">
    <option value="">none — grey or RGB</option>
    <option>viridis</option><option>magma</option><option>plasma</option>
    <option>inferno</option><option>cividis</option><option>terrain</option>
    <option>greys</option>
  </select>
  <div id="ramp"></div>

  <button id="load">Load</button>
  <div id="status"></div>
  <dl id="meta"></dl>
</aside>
<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// Mirrors source-cooperative/cog-viewer's example list.
const EXAMPLES = [
  ["Potential Above-Ground Combustion, Boreal/Arctic N. America (SSP585)",
   "https://data.source.coop/luddaludwig/potential-agc-combustion-ssp585-v0/AGC_final.tif"],
  ["Flood Extent Detection (North Carolina, 2018)",
   "https://data.source.coop/nasa/floods/florence_20180919t231350/florence_img_s1a_iw_rt30_20180919t231350_g_gpn_vh.tif"],
  ["Anderson Co. Ortho Pan 2ft (2000)",
   "https://data.source.coop/giswqs/tn-imagery/imagery/AndersonCo_OrthoPan_2ft_2000.tif"],
  ["Sentinel-2 True Color (New York, 2024-08-14)",
   "https://sentinel-cogs.s3.us-west-2.amazonaws.com/sentinel-s2-l2a-cogs/18/T/WL/2024/8/S2A_18TWL_20240814_0_L2A/TCI.tif"],
  ["New Zealand 2024-2025 10m RGB",
   "https://nz-imagery.s3-ap-southeast-2.amazonaws.com/new-zealand/new-zealand_2024-2025_10m/rgb/2193/CC11.tiff"],
  ["NAIP Aerial (New York, 2022)",
   "https://ds-wheels.s3.us-east-1.amazonaws.com/m_4007307_sw_18_060_20220803.tif"],
  ["NLCD Land Cover 2023",
   "https://ds-wheels.s3.us-east-1.amazonaws.com/Annual_NLCD_LndCov_2023_CU_C1V0.tif"],
  ["Sentinel-2 B04 (New York, 2024-08-14)",
   "https://sentinel-cogs.s3.us-west-2.amazonaws.com/sentinel-s2-l2a-cogs/18/T/WL/2024/8/S2A_18TWL_20240814_0_L2A/B04.tif"],
];

const $ = id => document.getElementById(id);
const sel = $("example"), status = $("status"), meta = $("meta");

sel.append(new Option("— pick an example —", ""));
for (const [title, url] of EXAMPLES) sel.append(new Option(title, url));
sel.onchange = () => { if (sel.value) { $("url").value = sel.value; load(); } };

const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: { osm: {
      type: "raster", tileSize: 256,
      tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
      attribution: "© OpenStreetMap contributors",
    }},
    layers: [{ id: "osm", type: "raster", source: "osm", paint: { "raster-opacity": 0.55 } }],
  },
  center: [0, 20], zoom: 1.5,
});

function say(msg, kind) { status.className = kind; status.textContent = msg; }

function clear() {
  if (map.getLayer("cog")) map.removeLayer("cog");
  if (map.getSource("cog")) map.removeSource("cog");
  meta.innerHTML = "";
}

/// Rewrite the address bar so the current view can be copied or reloaded.
/// Called on every pan and zoom, so it must stay cheap and must not push
/// history entries — the back button should leave the viewer, not retrace it.
function share() {
  const url = $("url").value.trim();
  if (!url) return;
  const q = new URLSearchParams({ url });
  for (const k of ["bidx", "rescale", "colormap_name"]) {
    const v = (k === "colormap_name" ? $("colormap") : $(k)).value.trim();
    if (v) q.set(k, v);
  }
  // getBounds works as soon as the map is constructed — do not gate this on
  // the style having loaded, or a slow basemap silently drops the bbox.
  try {
    const b = map.getBounds();
    // west,south,east,north — the order OGC services and /cog/bbox use.
    // Six decimals is ~10cm, well past what a map view needs.
    q.set("bbox", [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()]
      .map(v => +v.toFixed(6)).join(","));
  } catch { /* not positioned yet; the parameters alone still share fine */ }
  history.replaceState(null, "", "?" + q);
}

/// Frame the map on a `bbox=` from the address bar. Returns false when there
/// is not a usable one, so the caller falls back to the dataset's own extent.
function applyBbox(raw) {
  const v = (raw || "").split(",").map(Number);
  if (v.length !== 4 || v.some(Number.isNaN)) return false;
  const [w, s2, e, n] = v;
  if (w >= e || s2 >= n) return false;
  map.fitBounds([[w, s2], [e, n]], { padding: 0, animate: false });
  return true;
}

async function load() {
  const url = $("url").value.trim();
  if (!url) return;
  clear();
  say("Reading COG metadata…", "ok");

  share();

  let info;
  try {
    const r = await fetch("/cog/info?url=" + encodeURIComponent(url));
    info = await r.json();
    if (!r.ok) throw new Error(info.detail || r.statusText);
  } catch (e) { return say(e.message, "err"); }

  meta.innerHTML = Object.entries({
    size: `${info.width} × ${info.height}`,
    crs: info.crs,
    bands: info.band_count,
    dtype: `${info.sample_format}${info.bits_per_sample?.[0] ?? ""}`,
    compression: info.compression,
    overviews: info.overviews,
    nodata: info.nodata ?? "—",
  }).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");

  const q = new URLSearchParams({ url });
  const cmap = $("colormap").value;
  let bidx = $("bidx").value.trim();
  // A colormap needs exactly one band; take the first unless told otherwise.
  if (cmap && !bidx) bidx = "1";
  if (bidx) q.set("bidx", bidx);
  if (cmap) q.set("colormap_name", cmap);

  // Tiles default to a 0–255 range. That is wrong for anything that isn't
  // 8-bit, and wrong for the class rasters people reach for a colormap on —
  // LCMS change classes run 0–16, which 0–255 squashes into one dark band.
  // /cog/statistics is a separate call because on a COG without overviews it
  // reads full-resolution data, so only ask when the range actually matters.
  let rescale = $("rescale").value.trim();
  const eightBit = info.sample_format === "Uint" && info.bits_per_sample?.[0] === 8;
  if (!rescale && (!eightBit || cmap)) {
    say("Sampling the data for a display range…", "ok");
    try {
      const stats = await (await fetch("/cog/statistics?url=" + encodeURIComponent(url))).json();
      const picked = bidx ? bidx.split(",").map(n => +n)
                          : (info.band_count >= 3 ? [1, 2, 3] : [1]);
      rescale = picked
        .map(i => stats[`b${i}`])
        .filter(Boolean)
        .map(b => `${+b.percentile_2.toFixed(4)},${+b.percentile_98.toFixed(4)}`)
        .join(";");
      $("rescale").placeholder = rescale;
    } catch (e) { /* fall through to 0–255 */ }
  }
  if (rescale) q.set("rescale", rescale);

  const tj = await (await fetch("/cog/tilejson.json?" + q)).json();
  if (tj.detail) return say(tj.detail, "err");

  map.addSource("cog", { type: "raster", tiles: tj.tiles, tileSize: 256,
                         bounds: tj.bounds, minzoom: tj.minzoom, maxzoom: tj.maxzoom });
  map.addLayer({ id: "cog", type: "raster", source: "cog" });
  // A shared link says where to look; without one, frame the whole dataset.
  if (!applyBbox(pendingBbox)) {
    map.fitBounds([[tj.bounds[0], tj.bounds[1]], [tj.bounds[2], tj.bounds[3]]], { padding: 30 });
  }
  pendingBbox = null;
  say(`zoom ${tj.minzoom}–${tj.maxzoom} · rescale ${rescale || "0,255"}`, "ok");

  // Tiles are rendered in the Worker, so a failure there is the interesting one.
  map.once("error", e => { if (e.sourceId === "cog") say("tile request failed", "err"); });
}

function drawRamp() {
  const cm = $("colormap").value;
  const ramp = $("ramp");
  ramp.className = cm ? "on" : "";
  // Same stops the server interpolates, so the strip previews the real map.
  const css = {
    viridis: "#440154,#414487,#2a788e,#22a884,#7ad151,#fde725",
    magma:   "#000004,#3b0f70,#8c2981,#de4968,#fe9f6d,#fcfdbf",
    plasma:  "#0d0887,#6a00a8,#b12a90,#e16462,#fca636,#f0f921",
    inferno: "#000004,#420a68,#932667,#dd513a,#fca50a,#fcffa4",
    cividis: "#00224e,#123570,#3b496c,#575d6d,#a49d78,#fee838",
    terrain: "#333399,#0099ff,#00cc66,#ffff99,#805c54,#ffffff",
    greys:   "#000000,#ffffff",
  }[cm];
  ramp.style.background = css ? `linear-gradient(to right, ${css})` : "";
}

// moveend covers pan, zoom and fitBounds alike, and only fires once settled.
map.on("moveend", share);

$("colormap").onchange = () => { drawRamp(); if ($("url").value.trim()) load(); };
drawRamp();
$("load").onclick = load;
$("url").onkeydown = e => { if (e.key === "Enter") load(); };

const p = new URLSearchParams(location.search);
// Held until the layer is added, so fitBounds is not undone by the dataset fit.
let pendingBbox = p.get("bbox");
if (p.get("url")) {
  $("url").value = p.get("url");
  $("bidx").value = p.get("bidx") || "";
  $("rescale").value = p.get("rescale") || "";
  $("colormap").value = p.get("colormap_name") || "";
  drawRamp();
  sel.value = EXAMPLES.some(([, u]) => u === p.get("url")) ? p.get("url") : "";
  map.on("load", load);
}
</script>
